name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    name: Build and verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: Pack tarball
        run: npm pack
      - uses: actions/upload-artifact@v4
        with:
          name: package-tarball
          path: selora-*.tgz

  publish:
    name: Publish to npm
    needs: build
    # Publish is gated behind the protected 'npm' environment — requires owner's
    # manual approval. This job never runs unattended: the tag push only queues
    # it; the protected environment (required reviewers configured on GitHub)
    # holds it until a human approves. Agents never publish.
    environment: npm
    runs-on: ubuntu-latest
    # gh release create needs write access to repo contents (the default
    # GITHUB_TOKEN permissions may be read-only depending on repo settings).
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          registry-url: 'https://registry.npmjs.org'
      - uses: actions/download-artifact@v4
        with:
          name: package-tarball
      - name: Publish package
        run: npm publish ./selora-*.tgz --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
      - name: Create GitHub Release
        run: gh release create "$GITHUB_REF_NAME" ./selora-*.tgz --title "$GITHUB_REF_NAME" --generate-notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
